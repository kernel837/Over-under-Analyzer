<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deriv Pro Over/Under Auto-Trader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-950 text-gray-200 min-h-screen p-3 text-xs">

    <div class="max-w-md mx-auto">
        
        <div class="bg-gray-900 p-3 rounded-xl shadow-2xl mb-3 border border-gray-700">
            <div id="headerBalance" class="text-2xl font-black text-white mb-2">Balance: -</div>
            
            <input type="password" id="apiToken" placeholder="Paste Read/Trade API Token..." class="w-full bg-gray-800 border border-gray-700 rounded px-2 py-1.5 text-white mb-2 font-mono text-[10px]">
            
            <div class="grid grid-cols-2 gap-2">
                <select id="marketSelect" class="bg-gray-800 border border-gray-700 rounded px-2 py-1.5 text-white">
                    <option value="1HZ10V">Volatility 10 (1s)</option>
                    <option value="R_100">Volatility 100</option>
                </select>
                <select id="digitPrediction" class="bg-gray-800 border border-gray-700 rounded px-2 py-1.5 text-white">
                    <option value="4" selected>Barrier 4</option>
                    <option value="5">Barrier 5</option>
                </select>
            </div>

            <div class="grid grid-cols-3 gap-2 mt-2">
                <div><label class="text-[8px] text-gray-400">Stake ($)</label><input type="number" id="stake" value="1.00" class="w-full bg-gray-800 border border-gray-700 rounded text-center p-1"></div>
                <div><label class="text-[8px] text-gray-400">Mult</label><input type="number" id="mult" value="2.1" step="0.1" class="w-full bg-gray-800 border border-gray-700 rounded text-center p-1"></div>
                <div><label class="text-[8px] text-gray-400">Max Steps</label><input type="number" id="maxSteps" value="5" class="w-full bg-gray-800 border border-gray-700 rounded text-center p-1"></div>
            </div>

            <button id="connectBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded mt-3 transition">
                Connect & Trade
            </button>
        </div>

        <div class="grid grid-cols-2 gap-2 mb-3">
            <div id="overBox" class="bg-gray-900 p-2 rounded-lg text-center border border-gray-800">
                <div class="text-emerald-400 font-bold">OVER</div>
                <div id="overPct" class="text-lg">0%</div>
            </div>
            <div id="underBox" class="bg-gray-900 p-2 rounded-lg text-center border border-gray-800">
                <div class="text-rose-400 font-bold">UNDER</div>
                <div id="underPct" class="text-lg">0%</div>
            </div>
        </div>

        <div id="tradeLog" class="h-24 bg-black p-2 rounded border border-gray-800 font-mono text-[9px] text-emerald-500 overflow-y-auto">
            Ready...
        </div>
    </div>

    <script>
        let ws = null, tickHistory = [], isTrading = false, step = 0;
        let currentStake = 1.00;

        const connectBtn = document.getElementById('connectBtn');
        const tradeLogEl = document.getElementById('tradeLog');

        function log(msg) { tradeLogEl.prepend(document.createElement('div').innerHTML = `> ${msg}` || ''); }

        function connect() {
            const token = document.getElementById('apiToken').value;
            ws = new WebSocket("wss://ws.derivws.com/websockets/v3?app_id=1089");
            ws.onopen = () => {
                ws.send(JSON.stringify({ authorize: token }));
            };
            ws.onmessage = (msg) => {
                const data = JSON.parse(msg.data);
                if (data.msg_type === 'authorize') {
                    ws.send(JSON.stringify({ ticks: document.getElementById('marketSelect').value }));
                }
                if (data.msg_type === 'tick') processTick(data.tick);
                if (data.msg_type === 'buy') {
                    log("Trade Placed ID: " + data.buy.contract_id);
                }
            };
        }

        function processTick(tick) {
            const digit = parseInt(tick.quote.toString().slice(-1));
            tickHistory.push(digit);
            if(tickHistory.length > 100) tickHistory.shift();

            // Auto Trade Logic (Over 4 Example)
            if (!isTrading && tickHistory.length > 20) {
                const barrier = parseInt(document.getElementById('digitPrediction').value);
                const stake = parseFloat(document.getElementById('stake').value);
                
                // Logic: Buy OVER if digit > barrier
                isTrading = true;
                ws.send(JSON.stringify({
                    buy: 1,
                    parameters: {
                        amount: currentStake,
                        contract_type: "DIGITOVER",
                        duration: 1,
                        duration_unit: "t",
                        symbol: document.getElementById('marketSelect').value,
                        barrier: barrier.toString()
                    }
                }));
                
                // Handle Win/Loss Logic for Martingale (simplified placeholder)
                setTimeout(() => {
                    isTrading = false;
                    // In a production environment, you would check "proposal_open_contract" here
                    // to determine if we Win or Lose and adjust "currentStake" accordingly.
                }, 3000);
            }
        }

        connectBtn.onclick = connect;
    </script>
</body>
</html>
