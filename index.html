<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deriv Over/Under Analyzer</title>
    
    <meta name="theme-color" content="#111827">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-3 select-none text-xs">

    <div class="max-w-md mx-auto">
        
        <div class="mb-2 text-right">
            <a href="index.html" class="inline-block text-[10px] text-emerald-400 hover:underline">← Switch to Matches Analyzer</a>
        </div>

        <div class="bg-gray-800 p-3 rounded-xl shadow-lg mb-3 flex flex-col gap-2">
            <div>
                <label class="block text-[10px] font-medium text-gray-400 mb-0.5">API Trading Token</label>
                <input type="password" id="apiToken" placeholder="Paste your API token here..." class="w-full bg-gray-700 border border-gray-600 rounded-lg px-2 py-1 text-white focus:outline-none focus:border-emerald-500">
            </div>

            <div class="flex gap-2">
                <div class="flex-1">
                    <label class="block text-[10px] font-medium text-gray-400 mb-0.5">Market</label>
                    <select id="marketSelect" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-2 py-1 text-white">
                        <option value="1HZ10V" selected>Volatility 10 (1s) Index</option>
                        <option value="1HZ15V">Volatility 15 (1s) Index</option>
                        <option value="1HZ25V">Volatility 25 (1s) Index</option>
                        <option value="R_10">Volatility 10 Index</option>
                        <option value="R_100">Volatility 100 Index</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-medium text-gray-400 mb-0.5">Barrier</label>
                    <select id="digitPrediction" class="w-16 bg-gray-700 border border-gray-600 rounded-lg px-1 py-1 text-center text-white">
                        <option value="1">1</option><option value="2">2</option><option value="3">3</option>
                        <option value="4" selected>4</option>
                        <option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option>
                    </select>
                </div>
            </div>

            <div class="flex gap-2">
                <input type="number" id="stake" value="1.00" step="0.5" class="w-1/2 bg-gray-700 border border-gray-600 rounded-lg px-2 py-1 text-center text-white" placeholder="Stake ($)">
                <input type="number" id="martingale" value="2.1" step="0.1" class="w-1/2 bg-gray-700 border border-gray-600 rounded-lg px-2 py-1 text-center text-white" placeholder="Martingale Mult">
            </div>

            <button id="connectBtn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-gray-950 font-bold py-1.5 rounded-lg">
                Connect WebSocket
            </button>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-3">
            <div class="bg-gray-800 p-3 rounded-xl shadow-lg text-center">
                <span class="text-emerald-400 font-bold text-[11px]" id="overLabel">Over 4</span>
                <div id="overPct" class="text-2xl font-black text-white">0%</div>
            </div>
            <div class="bg-gray-800 p-3 rounded-xl shadow-lg text-center">
                <span class="text-rose-400 font-bold text-[11px]" id="underLabel">Under 4</span>
                <div id="underPct" class="text-2xl font-black text-white">0%</div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let isAuthorized = false;
        let currentStake = 1.00;

        const connectBtn = document.getElementById('connectBtn');

        function connectToDeriv() {
            const token = document.getElementById('apiToken').value.trim();
            if(!token) { alert("Please enter API token"); return; }
            
            ws = new WebSocket("wss://ws.derivws.com/websockets/v3?app_id=1089");

            ws.onopen = () => {
                ws.send(JSON.stringify({ authorize: token })); // AUTHORIZATION HAPPENS HERE
            };

            ws.onmessage = (msg) => {
                const data = JSON.parse(msg.data);
                if(data.msg_type === 'authorize') {
                    isAuthorized = true;
                    connectBtn.textContent = 'Trading Live...';
                    ws.send(JSON.stringify({ ticks: document.getElementById('marketSelect').value }));
                }
                if(data.msg_type === 'tick') processTick(data.tick);
            };
        }

        function processTick(tick) {
            if(!isAuthorized) return;

            const lastDigit = parseInt(tick.quote.toString().slice(-1));
            const barrier = parseInt(document.getElementById('digitPrediction').value);
            const stake = parseFloat(document.getElementById('stake').value);
            
            // AUTOMATIC EXECUTION ENGINE
            // For demo: Example logic to buy OVER if digit > barrier
            if(lastDigit > barrier) {
                ws.send(JSON.stringify({
                    buy: 1,
                    parameters: {
                        amount: stake,
                        basis: "stake",
                        contract_type: "DIGITOVER",
                        duration: 1,
                        duration_unit: "t",
                        symbol: document.getElementById('marketSelect').value,
                        barrier: barrier.toString()
                    }
                }));
            }
        }

        connectBtn.addEventListener('click', connectToDeriv);
    </script>
</body>
</html>
